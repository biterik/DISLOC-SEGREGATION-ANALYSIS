# Parameters of the v0.2 PROPOSALS that are still open (docs/DEFINITIONS.md sections marked [PROPOSAL v0.2]) -- NOT part
# of any definition set. Every number computed with a value from this file carries status = proposal in the output tables,
# and the results table refuses such a number for role "headline".
# 25 Nov 2026 (Erik): P1-P4 and E1 became definition set D2 (D2.yaml, sections mclean, hysteresis, bulk_control,
# alongline) and left this file. Only P5 is still open: it stays a proposal until Ni-Al MD/MC data exist.
label: P-v0.2
status: "proposal (2026-11-24; P5 only since 25 Nov), waiting for Ni-Al data -- see docs/OPEN-DECISIONS_v0.2.md"

ordered_domains:                         # [PROPOSAL v0.2] P5: L1_2-ordered domains (Ni-Al vs Howard et al. 2025, 2.7 +- 0.6 nm)
  max_solute_1st: 0                      # an ordered solute atom has no solute 1st neighbour ...
  min_solute_2nd: 4                      # ... and >= 4 of its 6 2nd neighbours solute (L1_2: 6, D0_22: 4)
  min_domain_solute: 4                   # domains = 2nd-shell-connected ordered solute atoms, >= 4 of them
  volume_per_solute_a3: 1.0              # L1_2: one solute atom per cubic cell a^3 -> d = (6 n a^3 / pi)^(1/3)
  include_border: true                   # + the solute 2nd neighbours of a domain (its surface): unbiased d (d / D 0.99-1.05)
